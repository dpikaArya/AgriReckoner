<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recommendation Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f7fa; color: #2c3e50; }
.header { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; padding: 24px 32px; }
.header h1 { font-size: 24px; }
.header p { opacity: 0.85; margin-top: 4px; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.card { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 20px; }
.card h2 { font-size: 16px; color: #27ae60; margin-bottom: 12px; }
.chart-row { display: flex; gap: 20px; flex-wrap: wrap; }
.chart-box { flex: 1; min-width: 300px; }
.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.filters select, .filters input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
.filters button { padding: 8px 16px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; }
.filters button:hover { background: #219a52; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #f8f9fa; font-weight: 600; color: #555; cursor: pointer; position: sticky; top: 0; }
th:hover { background: #eef; }
tr:hover { background: #f0faf4; }
.highlight { background: #d4efdf !important; font-weight: 600; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; }
.stat { background: white; border-radius: 8px; padding: 16px 20px; flex: 1; min-width: 140px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.stat .value { font-size: 24px; font-weight: 700; color: #27ae60; }
.stat .label { font-size: 12px; color: #7f8c8d; margin-top: 2px; }
.footer { text-align: center; padding: 20px; color: #95a5a6; font-size: 12px; }
</style>
</head>
<body>
<div class="header"><h1>Fertilizer Recommendation Dashboard</h1><p>Generated: 2026-07-07T22:01:32.595424</p></div>
<div class="container">
<div class="stats" id="stats"></div>
<div class="card">
<h2>Yield by Fertilizer Scenario</h2>
<div class="chart-row"><div class="chart-box"><canvas id="scatterChart"></canvas></div></div>
</div>
<div class="card">
<h2>Recommendations</h2>
<div class="filters">
<input type="text" id="filterInput" placeholder="Search..." onkeyup="filterTable()">
<select id="sortSelect" onchange="renderTable()"><option value="">Sort by...</option></select>
<button onclick="renderTable()">Refresh</button>
</div>
<div style="overflow-x:auto;" id="tableContainer"></div>
</div>
</div>
<div class="footer">ADES Recommendation Engine &mdash; Automated Decision Support</div>
<script>
const DATA = [{"Crop":null,"Variety":null,"Location":null,"Soil_pH":null,"Nitrogen":null,"Phosphorus":null,"Potassium":null,"Rainfall":100,"Temperature_Max":"30.00","Predicted_Yield":null,"Expected_Biomass":null,"Expected_Plant_Height":null,"Recommended_Fertilizer":null,"Recommended_Dose":null,"Recommended_Application_Interval":null,"Expected_Yield_Increase":null,"Confidence_Score":null,"Recommendation_Summary":null}];
const COLS = ["Crop", "Variety", "Location", "Soil_pH", "Nitrogen", "Phosphorus", "Potassium", "Rainfall", "Temperature_Max", "Predicted_Yield", "Expected_Biomass", "Expected_Plant_Height", "Recommended_Fertilizer", "Recommended_Dose", "Recommended_Application_Interval", "Expected_Yield_Increase", "Confidence_Score", "Recommendation_Summary"];

function renderStats() {
  const el = document.getElementById('stats');
  const n = DATA.length;
  const avgYield = DATA.reduce((s,r) => s + parseFloat(r.Predicted_Yield||0), 0) / n || 0;
  const avgConf = DATA.reduce((s,r) => s + parseFloat(r.Confidence_Score||0), 0) / n || 0;
  const recs = new Set(DATA.map(r => r.Recommended_Fertilizer).filter(Boolean)).size;
  el.innerHTML =
    '<div class="stat"><div class="value">' + n + '</div><div class="label">Scenarios</div></div>' +
    '<div class="stat"><div class="value">' + avgYield.toFixed(2) + '</div><div class="label">Avg Yield (t/ha)</div></div>' +
    '<div class="stat"><div class="value">' + (avgConf*100).toFixed(0) + '%</div><div class="label">Avg Confidence</div></div>' +
    '<div class="stat"><div class="value">' + recs + '</div><div class="label">Fertilizers Tested</div></div>';
}

function renderChart() {
  const ctx = document.getElementById('scatterChart').getContext('2d');
  const labels = DATA.map(r => r.Recommended_Fertilizer || 'N/A');
  const nValues = DATA.map(r => parseFloat(r.Nitrogen) || 0);
  const yValues = DATA.map(r => parseFloat(r.Predicted_Yield) || 0);

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels.map((l,i) => l + ' (N=' + nValues[i] + ')'),
      datasets: [
        { label: 'Predicted Yield', data: yValues, backgroundColor: '#27ae60', borderRadius: 4 },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: true } },
      scales: { y: { beginAtZero: true, title: { display: true, text: 'Yield (t/ha)' } } }
    }
  });
}

function renderTable() {
  const sortKey = document.getElementById('sortSelect').value;
  const filterVal = document.getElementById('filterInput').value.toLowerCase();
  let data = [...DATA];
  if (filterVal) data = data.filter(r => JSON.stringify(r).toLowerCase().includes(filterVal));
  if (sortKey) data.sort((a,b) => parseFloat(b[sortKey]||0) - parseFloat(a[sortKey]||0));
  const best = data.length > 0 ? Math.max(...data.map(r => parseFloat(r.Predicted_Yield)||0)) : 0;

  let html = '<table><thead><tr>' + COLS.map(c => '<th onclick="sortBy(\'' + c + '\')">' + c.replace(/_/g,' ') + '</th>').join('') + '</tr></thead><tbody>';
  data.forEach(r => {
    const isBest = parseFloat(r.Predicted_Yield) === best;
    html += '<tr class="' + (isBest ? 'highlight' : '') + '">' + COLS.map(c => '<td>' + (r[c] || '') + '</td>').join('') + '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tableContainer').innerHTML = html;
}

function sortBy(key) {
  document.getElementById('sortSelect').value = key;
  renderTable();
}

const sortSel = document.getElementById('sortSelect');
COLS.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c.replace(/_/g,' ');
  sortSel.appendChild(opt);
});

renderStats();
renderChart();
renderTable();
</script>
</body>
</html>
