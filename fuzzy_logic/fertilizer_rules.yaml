metadata:
  version: '2.0'
  description: Fuzzy expert rules for agronomist-style fertilizer recommendations
  inference: Mamdani + symbolic rule evaluation
  defuzzification: centroid
variables:
  input:
  - Nitrogen
  - Phosphorus
  - Potassium
  - Zinc
  - Soil_pH
  - Rainfall
  - Temperature_Max
  - Organic_Carbon
  - Growth_Stage
  - Yield_Prediction
  output_numeric:
  - Nitrogen_Adjustment
  - Potash_Adjustment
  - Irrigation_Adjustment
  - Dose_Adjustment
  output_symbolic:
  - N_Action
  - P_Action
  - K_Action
  - Zinc_Action
  - Risk
  - Confidence
rules:
- name: LowN_HighRain_LowOC
  description: 'Nitrogen deficient, heavy rain, low organic carbon: boost N'
  priority: 10
  antecedents:
  - var: Nitrogen
    set: low
  - var: Rainfall
    set: high
  - var: Organic_Carbon
    set: low
  consequents:
  - type: nutrient
    nutrient: Nitrogen
    action: increase
    amount: 20
    unit: '%'
  - type: nutrient
    nutrient: Potassium
    action: maintain
    amount: 0
    unit: ''
  - type: adjustment
    var: Nitrogen_Adjustment
    set: high
  - type: adjustment
    var: Irrigation_Adjustment
    set: low
  - type: adjustment
    var: Dose_Adjustment
    set: high
  - type: risk
    level: medium
  - type: confidence
    level: high
- name: HighpH_LowZinc
  description: 'Alkaline soil with low zinc: recommend zinc foliar spray'
  priority: 9
  antecedents:
  - var: Soil_pH
    set: alkaline
  - var: Zinc
    set: low
  consequents:
  - type: nutrient
    nutrient: Zinc
    action: apply_foliar_spray
    amount: 0
    unit: ''
  - type: nutrient
    nutrient: Nitrogen
    action: maintain
    amount: 0
    unit: ''
  - type: adjustment
    var: Dose_Adjustment
    set: medium
  - type: risk
    level: medium
  - type: confidence
    level: high
- name: HighYield_MediumK
  description: 'High yield prediction with medium potassium: maintain schedule'
