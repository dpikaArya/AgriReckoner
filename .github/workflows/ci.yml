name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      # Non-blocking for now: report findings without failing CI.
      - name: Ruff check
        run: ruff check .
        continue-on-error: true

  uaasop-gate:
    name: UAASOP gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run UAASOP integration gate
        run: python scripts/uaasop_gate.py

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # On Linux the xgboost wheel bundles OpenMP, so no system libomp needed.
      - name: Install package (dev + llm)
        run: pip install -e ".[dev,llm]"
      - name: Run tests
        run: pytest -m "not live" --cov=agri_ai_agent --cov-report=term-missing

  wheel-smoke:
    name: Wheel smoke (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Install wheel in a fresh venv without extras
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl
      - name: Import package and print version
        run: |
          /tmp/smoke-venv/bin/python -c "import agri_ai_agent, importlib.metadata as m; print(m.version('agri-ai-agent'))"
