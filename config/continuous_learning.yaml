# Phase 16 Autonomous Continuous Learning Engine configuration
# AAIF - closed-loop knowledge growth driven entirely from externalized
# operational parameters. No operational parameter is hardcoded in code.
# Safety invariant: validated observations, UAMS records and extraction
# pipelines are NEVER modified; every automated update is versioned,
# reversible and auditable.

learning:
  schedule:
    interval_sec: 86400        # check once per day
    max_runs_per_day: 1
    timezone: UTC

  discovery:
    # connectors to consult each cycle (approved sources only)
    sources:
      - OpenAlex
      - Crossref
      - Europe_PMC
      - PubMed
      - Semantic_Scholar
      - DataCite
      - DOAJ
      - AGRIS
      - arXiv
      - Zenodo
      - Figshare
      - FAOSTAT
      - CGIAR
      - ICRISAT
      - IRRI
      - CIMMYT
      - IFPRI
    max_per_source: 50
    require_doi: true
    dedupe_fields: [doi, title]
    dry_run: true               # true = plan only; no live API calls

  prioritization:
    weights:
      information_gain: 0.25
      crop_coverage: 0.15
      variable_coverage: 0.15
      treatment_coverage: 0.10
      geographic_coverage: 0.10
      experimental_quality: 0.10
      recency: 0.05
      citations: 0.05
      open_access: 0.025
      parser_compatibility: 0.025
      acquisition_cost: 0.10
    top_n: 10
    recency_halflife_years: 10
    citation_cap: 100
    cost_per_paper_units: 1.0

  acquisition:
    max_papers_per_cycle: 5
    min_priority_score: 0.30
    min_information_gain: 0.10
    require_integrity: true
    integrity_fields: [doi, checksum, license, landing_page, pdf_locations]

  extraction:
    new_papers_only: true
    verify_doi: true
    verify_checksum: true
    verify_license: true

  embedding:
    reuse_existing: true
    incremental: true
    # must match config/rag.yaml embedding block (single shared store)
    provider: sentence_transformers
    model: sentence-transformers/all-MiniLM-L6-v2

  selective_meta:
    affected_variables_only: true
    min_new_evidence_per_variable: 2
    max_recompute_per_cycle: 20

  readiness:
    # retraining is gated: never automatic unless allowed AND thresholds met
    retrain_allowed: false
    min_evidence_confidence: 0.60
    min_model_readiness_score: 0.80
    min_new_samples_for_retrain: 100
    target_file: outputs/phase15/model_readiness_targets.xlsx

  rag_sync:
    refresh_on_change: true
    rebuild_vector_index: false
    service_file: outputs/phase14_5a/Evidence_RAG_Database/service_health.json

  versioning:
    enabled: true
    changelog: outputs/phase16/versioning/changelog.json
    knowledge_version: 16.0.0
    ontology_version: 3.0.0
    embedding_version: 2.0.0
    ready_reckoner_version: 4.0.0
    meta_analysis_version: 2.0.0
    schema_version: 4.0.0
    model_version: 1.0.0

  safety:
    # never-modified data tables (validated evidence)
    never_modify:
      - outputs/UAMS_v2.parquet
      - outputs/phase14/harmonized_evidence.parquet
    never_delete_provenance: true
    reversible_updates: true
    backup_dir: outputs/phase16/backups

  phase16_1:
    # Evidence-gap driven literature discovery and intelligent acquisition.
    # dry_run: true = plan only, never download, never touch validated data.
    dry_run: true

    thresholds:
      minimum_information_gain: 0.10
      minimum_acquisition_confidence: 0.60
      maximum_candidates_per_cycle: 50
      maximum_recovery_candidates_per_cycle: 200
      maximum_recovery_attempts: 3
      retry_interval_days: 30
      preferred_publication_year: 2015
      minimum_study_quality: 0.35
      minimum_observations: 5
      minimum_replications: 3
      crop_priority:
        - Wheat
        - Rice
        - Maize
        - Sugarcane
        - Cotton
        - Tomato
        - Soybean
        - Potato
      variable_priority:
        - Yield_per_Hectare
        - Plant_Height_cm
        - Shoot_Biomass_g
        - SPAD
        - Grain_Yield
      treatment_priority:
        - Dose_N
        - Dose_P
        - Dose_K
        - Dose_S
        - Dose_B
        - Dose_Zn
        - Dose_Fe
        - Dose_Organic
      geographic_priority:
        - India
        - China
        - USA
        - Nigeria
        - Bangladesh
        - Brazil
        - Ethiopia
      source_priority:
        - OpenAlex
        - Crossref
        - Semantic_Scholar
        - Europe_PMC
        - DOAJ
        - Zenodo
        - Figshare
        - CGIAR

    scoring:
      # reproducible information-gain weights; normalised in code
      weights:
        evidence_gap_severity: 0.20
        expected_new_observations: 0.10
        expected_new_studies: 0.05
        crop_underrepresentation: 0.05
        variable_underrepresentation: 0.05
        treatment_underrepresentation: 0.05
        geographic_diversity: 0.05
        agroclimatic_diversity: 0.05
        experimental_quality: 0.05
        replication_information: 0.05
        full_text_availability: 0.10
        expected_extraction_quality: 0.05
        expected_ml_usefulness: 0.05
        expected_meta_usefulness: 0.05
        expected_rr_impact: 0.05
        expected_rag_impact: 0.05
        publication_recency: 0.05
        study_design_quality: 0.05
        acquisition_probability: 0.05
        acquisition_cost: 0.05
        deduplication_confidence: 0.05
      sub_weights:
        ml_value:
          usable_observations: 0.40
          feature_completeness: 0.30
          crop_representation: 0.30
        meta_value:
          study_count: 0.40
          heterogeneity: 0.30
          replication: 0.30
        rr_value:
          support_studies: 0.50
          confidence: 0.50
        rag_value:
          evidence_coverage: 0.50
          quality: 0.50

    priority_buckets:
      high_information_gain: 0.60
      medium_information_gain: 0.30

    recovery:
      eligible_states:
        - METADATA_ONLY
        - DOI_VERIFIED
        - FULL_TEXT_UNAVAILABLE
      ineligible_states:
        - PDF_PARSED
        - OBSERVATIONS_EXTRACTED
        - QC_APPROVED
        - ML_USABLE
        - META_ANALYSIS_USABLE
        - READY_RECKONER_USABLE
        - RAG_INDEXED

    sources:
      - OpenAlex
      - Crossref
      - Semantic_Scholar
      - Europe_PMC
      - OpenAIRE
      - CORE
      - DOAJ
      - Zenodo
      - Figshare
      - CGIAR
      - CGSpace
      - Scopus
      - Web_of_Science
      - Dimensions

    acquisition:
      enabled: false
      max_high_information_gain_per_cycle: 5
      max_recovery_per_cycle: 5
      require_checksum: true
      require_license: true

  phase16_2:
    # Controlled full-text recovery and incremental evidence acquisition.
    # Executes the recovery candidates identified by Phase 16.1.
    # dry_run: true = plan only, never download, never modify curated outputs.
    dry_run: true

    recovery:
      eligible_states:
        - METADATA_ONLY
        - DOI_VERIFIED
        - FULL_TEXT_UNAVAILABLE
        - PDF_AVAILABLE
        - PDF_VERIFIED
      exclude_states:
        - PDF_PARSED
        - OBSERVATIONS_EXTRACTED
        - QC_APPROVED
        - ML_USABLE
        - META_ANALYSIS_USABLE
        - READY_RECKONER_USABLE
        - RAG_INDEXED
      max_recovery_per_cycle: 200
      retry_interval_days: 30
      max_attempts_per_paper: 3
      require_license: true
      require_checksum: true

    sources:
      # ordered priority: attempt first -> last
      order:
        - OpenAlex
        - Crossref
        - Unpaywall
        - OpenAIRE
        - CORE
        - Europe_PMC
        - DOAJ
        - Zenodo
        - Figshare
        - CGIAR
        - CGSpace
        - Publisher_OpenAccess
        - Institutional_Repository
      discovery_only:
        - Scopus
        - Web_of_Science
        - Dimensions

    rate_limits:
      request_timeout_sec: 20
      max_requests_per_cycle: 120
      max_daily_requests: 500
      per_source_concurrency: 2
      retry_attempts: 3
      retry_backoff_base_sec: 1.0
      retry_backoff_max_sec: 30.0
      checkpoint_every: 10

    integrity:
      min_file_size_bytes: 1000
      min_text_characters: 200
      min_pages: 1
      require_pdf_signature: true
      reject_html_login_errors: true
      verify_checksum: true
      deterministic_storage: true

    qc:
      min_extraction_confidence: 0.60
      min_evidence_grade: C
      send_uncertain_to_review: true

    meta:
      selective_only: true
      min_new_observations_per_group: 2
      affected_group_fields:
        - Crop
        - Variable
        - Treatment
        - Unit
        - StudyGroup
        - Outcome

    ready_reckoner:
      selective_only: true
      min_new_observations_per_recommendation: 2

    rag:
      reuse_existing_embeddings: true
      incremental: true
      citation_accuracy_target: 0.95

    ml_readiness:
      recalculate: true
      retrain_allowed: false

    backup:
      enabled: true
      backup_dir: outputs/phase16_2/backups
      restore_on_failure: true

reports:
  top_rows: 20
