# AAIF — Per-connector rate limits, timeouts and retry budgets.
#
# Values here override the module defaults (LiteratureConfig.rate_limit_per_minute
# etc.).  Keys are connector source_names; keep them aligned with
# config/literature_sources.yaml.

defaults:
  rate_limit_per_minute: 30
  timeout_sec: 45
  retry_max: 3
  retry_base_delay_sec: 1.5

